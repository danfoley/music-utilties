name: Validate music app JavaScript
on:
  push:
    paths:
      - 'jazz-chart-studio/**'
      - 'spotify-setlist-builder/**'
      - 'tests/**'
      - '.github/workflows/validate-music-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check jazz-chart-studio/js/chart-core.js
          node --check jazz-chart-studio/js/app.js
          node --check spotify-setlist-builder/setlist-core.js
          node --check spotify-setlist-builder/app.js
      - name: Run core regression tests
        run: node tests/music-core.test.cjs
      - name: Verify application script references
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [htmlPath, jsPath] of [
            ['jazz-chart-studio/index.html', 'js/app.js'],
            ['spotify-setlist-builder/index.html', 'app.js']
          ]) {
            const html = fs.readFileSync(htmlPath, 'utf8');
            if (!html.includes('src="' + jsPath + '"')) throw Error(htmlPath + ' does not reference ' + jsPath);
          }
          NODE
