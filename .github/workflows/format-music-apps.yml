name: Format music app source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/format-music-apps.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format both apps (HTML, JavaScript)
        run: |
          npx --yes prettier@3.6.2 --write \
            jazz-chart-studio/index.html \
            jazz-chart-studio/js/app.js \
            spotify-setlist-builder/index.html
          npx --yes prettier@3.6.2 --check \
            jazz-chart-studio/index.html \
            jazz-chart-studio/js/app.js \
            spotify-setlist-builder/index.html
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add jazz-chart-studio/index.html jazz-chart-studio/js/app.js spotify-setlist-builder/index.html
            git commit -m 'Format app HTML and JavaScript for readability'
            git push
          fi
